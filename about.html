  <style>
main {
  padding-top: 10vw;
  display: flex;
  justify-content: center;
}

.iframe-row {
  width: 95%;
  max-width: 1300px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 1.5vw;
}

.iframe-box {
  flex: 0 1 32%;
  min-width: 300px;
  max-width: 400px; 
  aspect-ratio: 16 / 9;
  border-radius: 12px;
  overflow: hidden;
  background: rgba(0,0,0,0.3);
  border: 2px solid rgba(255,255,255,0.15);
}


.iframe-box iframe {
  width: 100%;
  height: 100%;
  border: none;
}


@media (max-width: 900px) {
  .iframe-box {
    flex: 0 1 80%;            
    max-width: 600px;
  }
}


    footer {
      margin-top: 5vw;
      text-align: center;
      font-family: 'Damion', sans-serif;

      text-shadow: 0 1px 2px rgba(0,0,0,0.7);
    }

    footer a {
      color: rgb(166,185,238);
      text-decoration: none;
    }
  </style>
</head>
