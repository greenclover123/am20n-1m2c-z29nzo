  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
   <script>
async function spawnCoinBox(userTokens) {
  // Load Matter.js if not loaded
  if (typeof Matter === 'undefined') {
    console.error("Matter.js is not loaded");
    return;
  }

  const totalTokens = userTokens;
  const tokensPerCoin = 1;
  const coinLimit = 124;
  const coinCount = totalTokens > 0 ? Math.ceil(totalTokens / tokensPerCoin) : 0;

  const { Engine, Render, Runner, World, Bodies, Mouse, MouseConstraint, Events, Body } = Matter;

  const width = window.innerWidth;
  const height = window.innerHeight;

  const engine = Engine.create();
  const world = engine.world;
  engine.gravity.y = 1;

  // Fullscreen canvas
  const canvas = document.getElementById('matterCanvas');
  canvas.width = width;
  canvas.height = height;

  const render = Render.create({
    canvas: canvas,
    engine: engine,
    options: { width, height, wireframes: false, background: 'transparent' }
  });
  Render.run(render);
  Runner.run(Runner.create(), engine);

  const coins = [];

  // Box size in VW/VH
  const boxW = 20; // 40vw
  const boxH = 25; // 30vh
  const boxWPx = (boxW / 100) * width;
  const boxHPx = (boxH / 100) * height;

  // Box position in VW/VH
  const boxX = (68 / 100) * width; // 50vw center
  const boxY = (65 / 100) * height; // 20vh from top

  // Create segmented walls
  function createWallSegments(x, y, w, h, pieces, horizontal = true) {
    const segments = [];
    for (let i = 0; i < pieces; i++) {
      const segWidth = horizontal ? w / pieces : w;
      const segHeight = horizontal ? h : h / pieces;
      const segX = horizontal ? x - w/2 + segWidth/2 + i * segWidth : x;
      const segY = horizontal ? y : y - h/2 + segHeight/2 + i * segHeight;
      const wall = Bodies.rectangle(segX, segY, segWidth, segHeight, {
        isStatic: true,
        render: { fillStyle: 'rgba(255,255,255,0.3)' }
      });
      segments.push(wall);
    }
    return segments;
  }

  let walls = [];
  walls = walls.concat(createWallSegments(boxX, boxY - boxHPx/2, boxWPx, 20, 8, true)); // top
  walls = walls.concat(createWallSegments(boxX, boxY + boxHPx/2, boxWPx, 20, 8, true)); // bottom
  walls = walls.concat(createWallSegments(boxX - boxWPx/2, boxY, 20, boxHPx, 6, false)); // left
  walls = walls.concat(createWallSegments(boxX + boxWPx/2, boxY, 20, boxHPx, 6, false)); // right
  World.add(world, walls);

  // Spawn coins inside box
  for (let i = 0; i < coinCount; i++) {
    const coin = Bodies.circle(
      boxX - boxWPx/2 + 16 + Math.random() * (boxWPx - 32),
      boxY - boxHPx/2 + 16 + Math.random() * (boxHPx - 32),
      12,
      {
        restitution: 0.6,
        friction: 0.1,
        render: { fillStyle: '#0b00a1', strokeStyle: 'black', lineWidth: 1 }
      }
    );
    coin.tokenValue = tokensPerCoin;
    coins.push(coin);
    World.add(world, coin);
  }

  // Mouse drag
  const mouse = Mouse.create(render.canvas);
  const mouseConstraint = MouseConstraint.create(engine, {
    mouse: mouse,
    constraint: { stiffness: 0.2, render: { visible: false } }
  });
  World.add(world, mouseConstraint);
  render.mouse = mouse;

  // Draw coin values
  Events.on(render, 'afterRender', () => {
    const ctx = render.context;
    ctx.font = "10px Arial";
    ctx.fillStyle = "white";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    coins.forEach(c => ctx.fillText(c.tokenValue, c.position.x, c.position.y));
  });

  // Explosion function
  function explodeBox() {
    walls.forEach(w => Body.setStatic(w, false));
    coins.forEach(c => {
      const force = 0.05 + Math.random() * 0.05;
      Body.applyForce(c, c.position, { x: (Math.random() - 0.5) * force, y: (Math.random() - 0.5) * force });
    });
    walls.forEach(w => {
      const force = 0.08 + Math.random() * 0.08;
      Body.applyForce(w, w.position, { x: (Math.random() - 0.5) * force, y: (Math.random() - 0.5) * force });
    });
  }

  // Remove off-screen bodies
  Events.on(engine, 'afterUpdate', () => {
    for (let i = coins.length -1; i >= 0; i--) {
      const c = coins[i];
      if (c.position.x < -50 || c.position.x > width + 50 || c.position.y < -50 || c.position.y > height + 50) {
        World.remove(world, c);
        coins.splice(i, 1);
      }
    }
    for (let i = walls.length -1; i >=0; i--) {
      const w = walls[i];
      if (w.position.x < -200 || w.position.x > width + 200 || w.position.y < -200 || w.position.y > height + 200) {
        World.remove(world, w);
        walls.splice(i, 1);
      }
    }
  });

  // Explode if over limit
  if (totalTokens > coinLimit) {
    setTimeout(explodeBox, 3000);
  }
}

</script>

 <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.0/firebase-app.js";
import { 
  getAuth, onAuthStateChanged, createUserWithEmailAndPassword, 
  signInWithEmailAndPassword, signOut, sendEmailVerification 
} from "https://www.gstatic.com/firebasejs/12.2.0/firebase-auth.js";
import { 
  getFirestore, doc, setDoc, getDoc, updateDoc, serverTimestamp, increment, onSnapshot 
} from "https://www.gstatic.com/firebasejs/12.2.0/firebase-firestore.js";

            authDomain: "skyless-84b51.firebaseapp.com",  
            projectId: "skyless-84b51",
            storageBucket: "skyless-84b51.appspot.com",
            messagingSenderId: "990229888756", // Replace with your actual Sender ID
            appId: "1:990229888756:web:ae7cc6a3f4bbbdb6c368a1" // Replace with your actual App ID
        };
  
// Initialize Firebase
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// --- Elements ---
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const loginButton = document.getElementById('loginButton');
const registerButton = document.getElementById('registerButton');
const logoutButton = document.getElementById('logoutButton');
const messageDiv = document.getElementById('message');

const loginPanel = document.getElementById('login-panel');
const signedPanel = document.getElementById('signed-panel');
const userEmailSpan = document.getElementById('user-email');
const userTokensSpan = document.getElementById('user-tokens');

const saveCloud = document.getElementById('saveCloud');
const loadCloud = document.getElementById('loadCloud');
const disableCooldownBtn = document.getElementById('disableCooldownBtn');
const dataMessage = document.getElementById('dataMessage');

let cooldownDisabled = false;

// --- Toast Helper with Queue ---
let toastQueue = [];
let activeToast = null;
let toastShowing = false;

function showToast(msg, isError = false) {
  // Add to queue
  toastQueue.push({ msg, isError });
  if (!toastShowing) {
    processNextToast();
  }
}

function processNextToast() {
  if (toastQueue.length === 0) {
    toastShowing = false;
    return;
  }

  toastShowing = true;
  const { msg, isError } = toastQueue.shift();

  const toast = document.createElement("div");
  toast.className = "panel-message";
  toast.textContent = msg;
  toast.style.background = isError
    ? "rgba(200,0,0,0.4)"
    : "rgba(166, 185, 238,0.15)";
  document.body.appendChild(toast);

  activeToast = toast;

  // Trigger fade-in
  requestAnimationFrame(() => toast.classList.add("show"));

  // Stay for 2s
  setTimeout(() => {
    toast.classList.remove("show");
    // After fade-out, remove + process next
    setTimeout(() => {
      toast.remove();
      if (activeToast === toast) activeToast = null;
      processNextToast();
    }, 500);
  }, 2000);
}

// UTF-8 Base64 helpers
function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary);
}
function base64ToUtf8(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

// --- Selenite Save / Load ---
function getMainSaveForFirebase() {
  try {
    const data = {};
    data.localStorage = utf8ToBase64(JSON.stringify(Object.entries(localStorage)));
    data.cookies = utf8ToBase64(document.cookie);
    return utf8ToBase64(JSON.stringify(data));
  } catch (err) {
    console.error("error encoding save:", err);
    return null;
  }
}

function loadMainSaveFromFirebase(encoded) {
  try {
    const decoded = JSON.parse(base64ToUtf8(encoded));
    const localStorageData = JSON.parse(base64ToUtf8(decoded.localStorage));
    const cookiesData = base64ToUtf8(decoded.cookies);
    for (const [key, value] of localStorageData) localStorage.setItem(key, value);
    document.cookie = cookiesData;
    showToast("data loaded!");
  } catch (err) {
    console.error("error decoding save:", err);
    showToast("failed to load data", true);
  }
}

// --- Auth Functions ---
registerButton.addEventListener('click', async () => {
  const email = emailInput.value;
  const password = passwordInput.value;
  if (!email || !password) { showToast("enter email and password"); return; }

  try {
    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;

    // Send verification email
    await sendEmailVerification(user);
    showToast("account created! check your email for verification before you can save/earn tokens.");

    // Add user doc
    const userRef = doc(db, 'users', user.uid);
    await setDoc(userRef, { email: user.email, tokens: 0, createdAt: serverTimestamp() });

  } catch(e) {
    showToast("registration failed: " + e.message, true);
  }
});

loginButton.addEventListener('click', async () => {
  const email = emailInput.value;
  const password = passwordInput.value;
  if (!email || !password) { showToast("enter email and password!", true); return; }

  try {
    await signInWithEmailAndPassword(auth, email, password);
    showToast("signed in !");
  } catch(e) {
    showToast("login failed: " + e.message, true);
  }
});

logoutButton.addEventListener('click', async () => {
  try {
    await signOut(auth);
    showToast("signed out");
  } catch(e) {
    showToast("logout failed: " + e.message, true);
  }
});



// --- Save / Load ---
saveCloud.addEventListener('click', async () => {
  const user = auth.currentUser;
  if (!user) { showToast("sign in first!", true); return; }
  const encoded = getMainSaveForFirebase();
  if (!encoded) { showToast("failed to encode data", true); return; }
  try {
    const userRef = doc(db, 'users', user.uid);
    await updateDoc(userRef, { seleniteSave: encoded, lastSaved: serverTimestamp() });
    showToast("data saved to cloud!");
  } catch(e) {
    console.error(e);
    showToast("failed to save data", true);
  }
});

loadCloud.addEventListener('click', async () => {
  const user = auth.currentUser;
  if (!user) { showToast("sign in first", true); return; }

  try {
    const userRef = doc(db, 'users', user.uid);
    const docSnap = await getDoc(userRef);
    if (!docSnap.exists() || !docSnap.data().seleniteSave) { showToast("no saved data!"); return; }

    loadMainSaveFromFirebase(docSnap.data().seleniteSave);

  } catch(e) {
    console.error(e);
    showToast("failed to load data!", true);
  }
});

disableCooldownBtn.addEventListener('click', () => {
  cooldownDisabled = true;
  showToast("load cooldown disabled!");
});

// --- Auth State Listener / Live Token Counter ---
onAuthStateChanged(auth, async (user) => {
  if (user) {
    await user.reload(); // refresh verification state
    loginPanel.style.display = 'none';
    signedPanel.style.display = 'block';
    userEmailSpan.textContent = user.email;

    // If not verified → restrict features
    if (!user.emailVerified) {
      userTokensSpan.textContent = "0";
      showToast("verify your email to start earning tokens and saving data!");

      // Disable restricted buttons
      saveCloud.disabled = true;
      loadCloud.disabled = true;
      disableCooldownBtn.disabled = true;

      return; // stop here (no tokens / coin box / live updates)
    }

    // If verified → enable everything
    saveCloud.disabled = false;
    loadCloud.disabled = false;
    disableCooldownBtn.disabled = false;

    const userRef = doc(db, 'users', user.uid);

    // Wrap async code in an immediately-invoked async function
    (async () => {
      // Fetch tokens once
      const docSnap = await getDoc(userRef);
      const tokens = docSnap.exists() ? docSnap.data().tokens ?? 0 : 0;
      userTokensSpan.textContent = tokens;

      // Spawn coin box overlay using existing tokens
      if (window.spawnCoinBox) window.spawnCoinBox(tokens);

      // Live token counter
      onSnapshot(userRef, (docSnap) => {
        if (docSnap.exists()) {
          userTokensSpan.textContent = docSnap.data().tokens ?? 0;
        } else {
          userTokensSpan.textContent = 0;
        }
      });
    })();

  } else {
    // Logged out
    loginPanel.style.display = 'block';
    signedPanel.style.display = 'none';
    emailInput.value = '';
    passwordInput.value = '';
    userEmailSpan.textContent = '';
    userTokensSpan.textContent = '0';
  }
});

</script>
</script>
