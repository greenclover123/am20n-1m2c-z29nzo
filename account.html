  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
let engine = null;
let render = null;
let world = null;
let coins = [];
let walls = [];

function destroyCoinBox() {
  if (render && render.canvas) render.canvas.style.display = "none";
  if (engine) {
    Matter.World.clear(world, false);
    Matter.Engine.clear(engine);
  }
  if (render) {
    Matter.Render.stop(render);
    render.canvas.getContext("2d").clearRect(0, 0, render.canvas.width, render.canvas.height);
    render = null;
  }
  engine = null;
  world = null;
  coins = [];
  walls = [];
}

async function spawnCoinBox(userTokens) {
  if (typeof Matter === "undefined") {
    console.error("Matter.js is not loaded");
    return;
  }
  destroyCoinBox();

  const totalTokens = userTokens;
  const tokensPerCoin = 1;
  const coinLimit = 124;
  const coinCount = totalTokens > 0 ? Math.ceil(totalTokens / tokensPerCoin) : 0;

  const { Engine, Render, Runner, World, Bodies, Mouse, MouseConstraint, Events, Body } = Matter;

  engine = Engine.create();
  world = engine.world;
  engine.gravity.y = 0.1;

  const canvas = document.getElementById("matterCanvas");
  canvas.style.display = "block";

  render = Render.create({
    canvas: canvas,
    engine: engine,
    options: { wireframes: false, background: "transparent" }
  });
  Render.run(render);
  Runner.run(Runner.create(), engine);


  const boxWPercent = 20;
  const boxHPercent = 25;
  const centerXPercent = 68;
  const centerYPercent = 62;
  const coinRPercent = 0.8;

  function buildScene() {
    World.clear(world, false);
    coins.length = 0;
    walls.length = 0;

    const width = window.innerWidth;
    const height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    const boxWPx = (boxWPercent / 100) * width;
    const boxHPx = (boxHPercent / 100) * height;
    const boxX = (centerXPercent / 100) * width;
    const boxY = (centerYPercent / 100) * height;
    const coinRadius = (coinRPercent / 100) * width;

    function createWallSegments(x, y, w, h, pieces, horizontal = true) {
      const segments = [];
      for (let i = 0; i < pieces; i++) {
        const segWidth = horizontal ? w / pieces : w;
        const segHeight = horizontal ? h : h / pieces;
        const segX = horizontal ? x - w / 2 + segWidth / 2 + i * segWidth : x;
        const segY = horizontal ? y : y - h / 2 + segHeight / 2 + i * segHeight;
        const wall = Bodies.rectangle(segX, segY, segWidth, segHeight, {
          isStatic: true,
          render: { fillStyle: "rgba(200,200,200,0.3)" }
        });
        segments.push(wall);
      }
      return segments;
    }

    walls = walls.concat(createWallSegments(boxX, boxY - boxHPx / 2, boxWPx, 20, 8, true));
    walls = walls.concat(createWallSegments(boxX, boxY + boxHPx / 2, boxWPx, 20, 8, true));
    walls = walls.concat(createWallSegments(boxX - boxWPx / 2, boxY, 20, boxHPx, 6, false));
    walls = walls.concat(createWallSegments(boxX + boxWPx / 2, boxY, 20, boxHPx, 6, false));
    World.add(world, walls);

    for (let i = 0; i < coinCount; i++) {
      const coin = Bodies.circle(
        boxX - boxWPx / 2 + coinRadius + Math.random() * (boxWPx - 2 * coinRadius),
        boxY - boxHPx / 2 + coinRadius + Math.random() * (boxHPx - 2 * coinRadius),
        coinRadius,
        {
          restitution: 0.6,
          friction: 0.1,
          render: { fillStyle: "#78E3C5", strokeStyle: "white", lineWidth: 1 }
        }
      );
      coin.tokenValue = tokensPerCoin;
      coins.push(coin);
      World.add(world, coin);
    }

    const mouse = Mouse.create(render.canvas);
    const mouseConstraint = MouseConstraint.create(engine, {
      mouse: mouse,
      constraint: { stiffness: 0.2, render: { visible: false } }
    });
    World.add(world, mouseConstraint);
    render.mouse = mouse;
  }

  buildScene();

  Events.on(render, "afterRender", () => {
    const ctx = render.context;
    ctx.font = "10px Arial";
    ctx.fillStyle = "white";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    coins.forEach(c => ctx.fillText(c.tokenValue, c.position.x, c.position.y));
  });


  function explodeBox() {
    walls.forEach(w => Body.setStatic(w, false));
    coins.forEach(c => {
      const force = 0.05 + Math.random() * 0.05;
      Body.applyForce(c, c.position, { x: (Math.random() - 0.5) * force, y: (Math.random() - 0.5) * force });
    });
    walls.forEach(w => {
      const force = 0.08 + Math.random() * 0.08;
      Body.applyForce(w, w.position, { x: (Math.random() - 0.5) * force, y: (Math.random() - 0.5) * force });
    });
  }


  Events.on(engine, "afterUpdate", () => {
    const width = window.innerWidth;
    const height = window.innerHeight;
    for (let i = coins.length - 1; i >= 0; i--) {
      const c = coins[i];
      if (c.position.x < -50 || c.position.x > width + 50 || c.position.y < -50 || c.position.y > height + 50) {
        World.remove(world, c);
        coins.splice(i, 1);
      }
    }
    for (let i = walls.length - 1; i >= 0; i--) {
      const w = walls[i];
      if (w.position.x < -200 || w.position.x > width + 200 || w.position.y < -200 || w.position.y > height + 200) {
        World.remove(world, w);
        walls.splice(i, 1);
      }
    }
  });

  if (totalTokens > coinLimit) setTimeout(explodeBox, 3000);

  window.addEventListener("resize", () => {
    buildScene();
  });
}
</script>

const app = initializeApp(firebaseConfig);

let toastQueue = [];
let activeToast = null;
let toastShowing = false;

function showToast(msg, isError = false) {

  toastQueue.push({ msg, isError });
  if (!toastShowing) {
    processNextToast();
  }
}

function processNextToast() {
  if (toastQueue.length === 0) {
    toastShowing = false;
    return;
  }

  toastShowing = true;
  const { msg, isError } = toastQueue.shift();

  const toast = document.createElement("div");
  toast.className = "panel-message";
  toast.textContent = msg;
  toast.style.background = isError
    ? "rgba(200,0,0,0.4)"
    : "rgba(207, 201, 243, 0.15)";
  document.body.appendChild(toast);

  activeToast = toast;


  requestAnimationFrame(() => toast.classList.add("show"));


  setTimeout(() => {
    toast.classList.remove("show");
    setTimeout(() => {
      toast.remove();
      if (activeToast === toast) activeToast = null;
      processNextToast();
    }, 500);
  }, 2000);
}


function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary);
}
function base64ToUtf8(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}


function getMainSaveForFirebase() {
  try {
    const data = {};
    data.localStorage = utf8ToBase64(JSON.stringify(Object.entries(localStorage)));
    data.cookies = utf8ToBase64(document.cookie);
    return utf8ToBase64(JSON.stringify(data));
  } catch (err) {
    console.error("error encoding save:", err);
    return null;
  }
}

function loadMainSaveFromFirebase(encoded) {
  try {
    const decoded = JSON.parse(base64ToUtf8(encoded));
    const localStorageData = JSON.parse(base64ToUtf8(decoded.localStorage));
    const cookiesData = base64ToUtf8(decoded.cookies);
    for (const [key, value] of localStorageData) localStorage.setItem(key, value);
    document.cookie = cookiesData;
    showToast("data loaded!");
  } catch (err) {
    console.error("error decoding save:", err);
    showToast("failed to load data", true);
  }
}


registerButton.addEventListener('click', async () => {
  const email = emailInput.value;
  const password = passwordInput.value;
  if (!email || !password) { showToast("enter email and password"); return; }

  try {
    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;


    await sendEmailVerification(user);
    showToast("account created! check your email for verification before you can save/earn tokens.");

    const userRef = doc(db, 'users', user.uid);
    await setDoc(userRef, { email: user.email, tokens: 0, createdAt: serverTimestamp() });

  } catch(e) {
    showToast("registration failed: " + e.message, true);
  }
});

loginButton.addEventListener('click', async () => {
  const email = emailInput.value;
  const password = passwordInput.value;
  if (!email || !password) { showToast("enter email and password!", true); return; }

  try {
    await signInWithEmailAndPassword(auth, email, password);
    showToast("signed in !");
  } catch(e) {
    showToast("login failed: " + e.message, true);
  }
});

logoutButton.addEventListener('click', async () => {
  try {
    await signOut(auth);
    showToast("signed out");
  } catch(e) {
    showToast("logout failed: " + e.message, true);
  }
});


saveCloud.addEventListener('click', async () => {
  const user = auth.currentUser;
  if (!user) { showToast("sign in first!", true); return; }
  const encoded = getMainSaveForFirebase();
  if (!encoded) { showToast("failed to encode data", true); return; }
  try {
    const userRef = doc(db, 'users', user.uid);
    await updateDoc(userRef, { ghsave: encoded, lastSaved: serverTimestamp() });
    showToast("data saved to cloud!");
  } catch(e) {
    console.error(e);
    showToast("failed to save data", true);
  }
});

loadCloud.addEventListener('click', async () => {
  const user = auth.currentUser;
  if (!user) { showToast("sign in first", true); return; }

  try {
    const userRef = doc(db, 'users', user.uid);
    const docSnap = await getDoc(userRef);
    if (!docSnap.exists() || !docSnap.data().ghsave) { showToast("no saved data!"); return; }

    loadMainSaveFromFirebase(docSnap.data().ghsave);

  } catch(e) {
    console.error(e);
    showToast("failed to load data!", true);
  }
});




onAuthStateChanged(auth, async (user) => {
  if (user) {
    await user.reload();
    loginPanel.style.display = 'none';
    signedPanel.style.display = 'block';
    userEmailSpan.textContent = user.email;

    if (!user.emailVerified) {
      userTokensSpan.textContent = "0";
      showToast("verify your email to start earning tokens and saving data");


      saveCloud.disabled = true;
      loadCloud.disabled = true;

     
      if (window.destroyCoinBox) window.destroyCoinBox();

      return; 
    }

    
    saveCloud.disabled = false;
    loadCloud.disabled = false;

    const userRef = doc(db, 'users', user.uid);

    (async () => {
      
      const docSnap = await getDoc(userRef);
      const tokens = docSnap.exists() ? docSnap.data().tokens ?? 0 : 0;
      userTokensSpan.textContent = tokens;

      
      if (window.spawnCoinBox) window.spawnCoinBox(tokens);

      
      onSnapshot(userRef, (docSnap) => {
        if (docSnap.exists()) {
          const newTokens = docSnap.data().tokens ?? 0;
          userTokensSpan.textContent = newTokens;

        
          if (window.spawnCoinBox) window.spawnCoinBox(newTokens);
        } else {
          userTokensSpan.textContent = 0;
      
          if (window.destroyCoinBox) window.destroyCoinBox();
        }
      });
    })();

  } else {
  
    loginPanel.style.display = 'block';
    signedPanel.style.display = 'none';
    emailInput.value = '';
    passwordInput.value = '';
    userEmailSpan.textContent = '';
    userTokensSpan.textContent = '0';

    
    if (window.destroyCoinBox) window.destroyCoinBox();
  }
});


</script>
