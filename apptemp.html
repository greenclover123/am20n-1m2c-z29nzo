<script type="text/javascript">
// --- Token display ---
const tokenDisplay = document.createElement("div");
Object.assign(tokenDisplay.style, {
  marginTop: "0.9vw",
  position: "fixed",
  fontSize: "1.6vw",
  top: "2.5vw",
  right: "1.5vw",
  padding: "3px 14px",
  borderRadius: "8px",
  background: "rgba(88, 98, 125, 0.15)",
  border: "1px solid rgba(78, 87, 112, 0.3)",
  fontWeight: "500",
  transition: "all 0.3s ease",
  textShadow: "0 1px 2px rgba(0,0,0,0.6)",
  color: "rgb(166, 185, 238)",
  fontFamily: "'Damion', sans-serif",
  visibility: "visible"
});
tokenDisplay.textContent = "0 tokens";
document.body.appendChild(tokenDisplay);

// --- Active timer display ---
const activeTimerDisplay = document.createElement("div");
Object.assign(activeTimerDisplay.style, {
  marginTop: "0.9vw",
  position: "fixed",
  top: "5.6vw",
  right: "1.6vw",
  fontSize: "1.2vw",
  padding: "3px 14px",
  borderRadius: "8px",
  background: "rgba(88, 98, 125, 0.15)",
  border: "1px solid rgba(78, 87, 112, 0.3)",
  fontWeight: "500",
  transition: "all 0.3s ease",
  textShadow: "0 1px 2px rgba(0,0,0,0.6)",
  color: "rgb(166, 185, 238)",
  fontFamily: "'Damion', sans-serif",
  visibility: "visible",
  textAlign: "center"
});
activeTimerDisplay.textContent = "00:00";
document.body.appendChild(activeTimerDisplay);

// --- Popup for rewards ---
const popup = document.createElement("div");
Object.assign(popup.style, {
  position: "fixed",
  top: "8.1vw",
  right: "1.5vw",
  padding: "12px 16px",
  color: "white",
  fontSize: "1.8vw",
  opacity: "0",
  transform: "translateX(12px)",
  transition: "opacity 0.35s ease, transform 0.35s ease",
  zIndex: 9999,
  pointerEvents: "none",
  color: "rgb(166, 185, 238)",
  fontFamily: "'Damion', sans-serif",
  src: "url('/resource/Damion-8gnD.ttf') format('truetype')"
});
document.body.appendChild(popup);

function showPopup(text){
  popup.textContent = text;
  popup.style.opacity = "1";
  popup.style.transform = "translateX(0)";
  setTimeout(()=>{
    popup.style.opacity = "0";
    popup.style.transform = "translateX(12px)";
  }, 3000);
}

// --- Token reward constants ---
const REWARD_SECONDS = 300; // 5 minutes
const REWARD_AMOUNT = 5;

// --- Timer variables ---
let activeSeconds = 0;
let tokenInterval = null;

// --- User activity tracking ---
let lastActivity = Date.now();
let isActive = false; // start paused
const INACTIVITY_TIMEOUT = 10 * 1000; // 10 seconds

// --- Anti-macro entropy system ---
let entropyScore = 0;
let lastX = null, lastY = null, lastTs = null;

function processActivityEvent(data){
  const {x, y, ts} = data;

  if(lastTs){
    const dt = ts - lastTs;
    if(dt > 30 && dt < 5000){
      entropyScore += Math.random() * (1000/dt);
    }
  }

  if(lastX !== null && lastY !== null){
    const dx = Math.abs(x-lastX);
    const dy = Math.abs(y-lastY);
    const dist = Math.sqrt(dx*dx+dy*dy);
    if(dist > 0) entropyScore += Math.random() * (dist/50);
  }

  lastX = x; lastY = y; lastTs = ts;

  if(entropyScore > 100) entropyScore = 100;

  // ✅ Update last activity FIRST
  lastActivity = Date.now();

  // ✅ Resume timer if paused
  if(!isActive){
    startInterval(currentUser);
    activeTimerDisplay.style.background = "rgba(88, 98, 125, 0.15)";
    activeTimerDisplay.textContent = formatTime(activeSeconds);
  }
}

// --- Format time mm:ss ---
function formatTime(sec){
  const m = Math.floor(sec/60).toString().padStart(2,'0');
  const s = (sec%60).toString().padStart(2,'0');
  return `${m}:${s}`;
}

function updateActiveTimerDisplay(){
  activeTimerDisplay.textContent = formatTime(activeSeconds);
}

// --- Give tokens ---
async function giveTokens(user){
  if(entropyScore < 10){ 
    console.warn("possible macro. skipping reward."); 
    return;
  }

  const userRef = firebase.firestore().collection("users").doc(user.uid);
  try{
    await firebase.firestore().runTransaction(async transaction => {
      const docSnap = await transaction.get(userRef);
      const now = Date.now();
      const lastReward = docSnap.exists && docSnap.data().lastRewardTime ? docSnap.data().lastRewardTime.toMillis() : 0;

      if(now - lastReward >= REWARD_SECONDS*1000){
        transaction.update(userRef, {
          tokens: firebase.firestore.FieldValue.increment(REWARD_AMOUNT),
          lastRewardTime: firebase.firestore.Timestamp.fromMillis(now)
        });
        showPopup(`${REWARD_AMOUNT} tokens earned!`);
        entropyScore = 0; // reset after reward
      }
    });
  }catch(err){
    console.error("failed to give tokens", err);
  }
}

let currentUser = null;

// --- Interval logic ---
function startInterval(user){
  if(tokenInterval) return;
  isActive = true;
  tokenInterval = setInterval(async ()=>{
    const idleTooLong = Date.now() - lastActivity > INACTIVITY_TIMEOUT || document.hidden;
    if(idleTooLong){
      stopInterval();
      activeTimerDisplay.style.background = "rgba(255,100,100,0.15)";
      activeTimerDisplay.textContent = formatTime(activeSeconds) + " (paused)";
      return;
    }

    activeSeconds++;
    updateActiveTimerDisplay();
    if(activeSeconds >= REWARD_SECONDS){
      activeSeconds = 0;
      if(user) await giveTokens(user);
    }
  }, 1000);
}

function stopInterval(){
  if(tokenInterval){
    clearInterval(tokenInterval);
    tokenInterval = null;
  }
  isActive = false;
}

// --- Listen for iframe activity ---
window.addEventListener("message",(event)=>{
  if(event.data && event.data.type === "iframe-activity"){
    processActivityEvent(event.data);
  }
});

// --- Local activity fallback ---
["mousemove","keydown","click"].forEach(evt=>{
  document.addEventListener(evt,(e)=>{
    processActivityEvent({x:e.clientX||0,y:e.clientY||0,ts:Date.now()});
  });
});

// --- Listen for auth changes ---
firebase.auth().onAuthStateChanged(user=>{
  stopInterval();
  activeSeconds = 0;
  updateActiveTimerDisplay();

  currentUser = user;

  if(user){
    tokenDisplay.style.visibility = "visible";
    activeTimerDisplay.style.visibility = "visible";
    activeTimerDisplay.style.background = "rgba(88, 98, 125, 0.15)";

    const userRef = firebase.firestore().collection("users").doc(user.uid);
    userRef.onSnapshot(doc=>{
      if(doc.exists){
        tokenDisplay.textContent = (doc.data().tokens || 0) + " tokens";
      } else {
        tokenDisplay.textContent = "0 tokens";
        userRef.set({
          tokens:0,
          email:user.email,
          lastRewardTime:firebase.firestore.Timestamp.now()
        },{merge:true});
      }
    }, err=>console.error(err));

    startInterval(user);
  } else {
    tokenDisplay.style.visibility = "hidden";
    tokenDisplay.textContent = "no account";
    activeTimerDisplay.style.visibility = "hidden";
    activeTimerDisplay.textContent = "00:00";
  }
});
</script>
