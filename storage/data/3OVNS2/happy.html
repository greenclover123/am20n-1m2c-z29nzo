<!DOCTYPE html>
<html>
<head>
  <title>happy</title>
</head>
<body>
  <style>
    body {
    background-image: url("mywish.jpg");
    height: 100vh;
    background-size: cover;
    overflow: hidden;
    }
  </style>

  <center style="margin-top: 20%;">
    <span>im happy being in the light, but its so lonely up here</span><br>
    <br>
    <span>i wish i was with you</span>
    <br>
    <br>
    <input type="text" id="pass">
    <button id="btn">talk it !</button>
    
  
  </center>
  

  <script>
    const passinput = document.getElementById('pass');
    const btn = document.getElementById('btn');
    const pageid = 20;

    async function checkPass() {
      const attempt = passinput.value.toLowerCase().trim();
      try {
        const res = await fetch(`./${attempt}.json`);
        if (res.ok) {
          const data = await res.json();
          if (data.id === pageid && data.redirect) {
            window.location.href = data.redirect;
          }
        }
      } catch (e) {}
    }

    btn.onclick = checkPass;

    passinput.onkeydown = (e) => {
      if (e.key === 'Enter') checkPass();
    };
  </script>

</body>
</html>
