    <script>
        const boxes = document.querySelectorAll('.box');
    
        boxes.forEach(box => {
          box.addEventListener('input', async () => {
            let attempt = "";
            boxes.forEach(b => attempt += b.value);
            let rightAttempt = attempt.toLowerCase().replace(/\s+/g, '');
            if (rightAttempt.length > 3) {
              try {
                const res = await fetch(`/${rightAttempt}.json`);
                if (res.ok) {
                  const data = await res.json();
                  if (data.redirect) {
                    window.location.href = data.redirect;
                  }
                }
              } catch (error) {
              }
            }
          });
        });
      </script>
