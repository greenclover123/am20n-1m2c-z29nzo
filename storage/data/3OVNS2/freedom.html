<!DOCTYPE html>
<html>
<head>
  <title>till it counts till the real forgiveness</title>
</head>
<body>

  <h1 id="timer">its waiting for you</h1>

  <script>
    const targetDate = new Date("May 13, 2026 11:20:50").getTime();

    const countdown = setInterval(function() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById("timer").innerHTML = days + "d " + hours + "h " + minutes + "m " + seconds + "s ";

      if (distance < 0) {
        clearInterval(countdown);
        const destination = "L3N0b3JhZ2UvZGF0YS8zT1ZOUzIvZGVzZW5k";
        window.location.href = atob(destination);
      }
    }, 1000);
  </script>

</body>
</html>
