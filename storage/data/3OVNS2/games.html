<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>skyless hub</title>
  <link rel="icon" type="image/x-icon" href="/images/faviconyes.ico">
  <link rel="stylesheet" href="/css/g-mes.css">
  
  
</head>


  <main style="padding-top: 8vw; text-align:center;">
    <div id="featured" class="featured"></div>

    <div class="genre-nav">
      <div id="genreList" class="genre-list"></div>
      <input type="text" id="gameSearch" placeholder="search g-mes...">
    </div>

    <div id="games"></div>
  
 <script type="module" src="/script.js"></script>
    <button id="kill-btn">secret games</button>
    <p id="status"></p>

    <script>
        document.getElementById('kill-btn').onclick = async function() {
            if(!confirm("make sure you are directly focused on this okay?")) return;
            
            const btn = this;
            btn.disabled = true;
            btn.innerText = "loading";

            try {
                const response = await fetch('https://dooms.b-cdn.net', {
                    method: 'POST'
                });
                
                if (response.ok) {
                    document.getElementById('status').innerText = "forgotten";
                } else {
                    document.getElementById('status').innerText = "fail";
                    btn.disabled = false;
                }
            } catch (e) {
                document.getElementById('status').innerText = "stopped";
            }
        };
    </script>



  </main>

  <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js'></script>
  <script src="/page.js"></script>

</body>
</html>
