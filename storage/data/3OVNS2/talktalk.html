<!DOCTYPE html>
<html>
<head>
  <title>im here</title>
</head>
<body>
  <style>
    body {
    background-image: url("mychildren.png");
    height: 100vh;
    background-size: cover;
    overflow: hidden;
    }
  </style>

  <center style="margin-top: 20%;">
    <h1>hello</h1>
    <br>
    <span>i know its bright here</span>
    <br>
    <span>but i dont understand why you came</span><br>
    <span>this wasnt meant for you</span><br>
    <span>your whole life wasnt meant for you</span><br>
    <br>
    <span>tell me why you wanted to come here?</span><br>
    <br>
    <input type="text" id="pass">
    <button id="talk">enter</button>
    <br>
    <br>
  </center>
  

  <script>
    const passinput = document.getElementById('pass');
    const btn = document.getElementById('talk');
    const pageid = 14;

    async function checkPass() {
      const attempt = passinput.value.toLowerCase().trim();
      try {
        const res = await fetch(`./${attempt}.json`);
        if (res.ok) {
          const data = await res.json();
          if (data.id === pageid && data.redirect) {
            window.location.href = data.redirect;
          }
        }
      } catch (e) {}
    }

    btn.onclick = checkPass;

    passinput.onkeydown = (e) => {
      if (e.key === 'Enter') checkPass();
    };
  </script>

</body>
</html>
