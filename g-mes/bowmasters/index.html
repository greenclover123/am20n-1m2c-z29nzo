<script nonce="nDK4DWRLJoqf7mjw9cLs1g">window.addEventListener("load", () => window.runGame());</script>

<body>
    <div id="game"></div>
<script>
  ["mousemove","keydown","click","touchstart"].forEach(evt=>{
    document.addEventListener(evt, e=>{
      parent.postMessage({
        type:"iframe-activity",
        x: e.clientX || 0,
        y: e.clientY || 0,
        ts: Date.now()
      },"*");
    });
  });
</script>

</body>
