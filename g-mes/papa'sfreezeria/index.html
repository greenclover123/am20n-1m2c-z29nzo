<html>
  <head>

<script src="/js/all.js"></script>
<style>
  * {
    margin: 0;
    padding: 0;
  }

  canvas {
    outline: none
  }

  html,
  body,
  #container {
    margin: 0;
    overflow: hidden;
    width: 100%;
    height: 100%;
    background-color: black;
  }

  #splash {
    position: absolute;
    visibility: hidden;
    z-index: 10;
  }

  #splash__image {
    position: absolute;
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
    background-image: url("assets/papa_hotdoggeria_splashscreen.jpg");
    visibility: visible;
    transition: all 0.5s;
    z-index: 10;
  }

  #progress__root {
    position: absolute;
  }

  #progress__line {
    width: 0;
    height: 100%;
    transition: all 0.5s;
  }
</style>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Papas Freezeria</title>
    <style>html{background-color:#000;}</style>
  </head>
  <body>
    <div id="ruffle" width="100%" height="100%"></div>
    <script src="/storage/ruffle/ruffle.js"></script>
    <script>
      window.RufflePlayer = window.RufflePlayer || {};
      window.addEventListener("load", (event) => {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        const container = document.getElementById("ruffle");
        player.id = "player";
        player.style.width = "100%";
        player.style.height = "100%";
        container.appendChild(player);
        player.load("papasfreezeria.swf");
      });
    </script>
  <script>
  ["mousemove","keydown","click","touchstart"].forEach(evt=>{
    document.addEventListener(evt, e=>{
      parent.postMessage({
        type:"iframe-activity",
        x: e.clientX || 0,
        y: e.clientY || 0,
        ts: Date.now()
      },"*");
    });
  });
</script>

</body>
</html>
