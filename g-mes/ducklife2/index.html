    <style>
      body {
        flex-direction: row;
        background-color: #343838;
        height: 90vh;
        padding: 0;
        margin: 0;
        display: flex;
        align-items: center;

  <body>
    <a href="unity/index.html">Unity</a>

    <div>
    <h2 style="color: darkgoldenrod;">choose unity for the better experience</h2>
    </div>
  <script>
  ["mousemove","keydown","click","touchstart"].forEach(evt=>{
    document.addEventListener(evt, e=>{
      parent.postMessage({
        type:"iframe-activity",
        x: e.clientX || 0,
        y: e.clientY || 0,
        ts: Date.now()
      },"*");
    });
  });
</script>

</body>
</html>
