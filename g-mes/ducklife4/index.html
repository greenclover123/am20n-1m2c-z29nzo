    <style>
      body {
        flex-direction: row;

        display: flex;

  <body>
    <a href="unity/index.html" style="text-decoration: line-through; color: red;">Unity</a>

    <h2 style="color: darkgoldenrod;">unity doesnt work for some reason, so pick flash</h2>
  <script>
  ["mousemove","keydown","click","touchstart"].forEach(evt=>{
    document.addEventListener(evt, e=>{
      parent.postMessage({
        type:"iframe-activity",
        x: e.clientX || 0,
        y: e.clientY || 0,
        ts: Date.now()
      },"*");
    });
  });
</script>

</body>
