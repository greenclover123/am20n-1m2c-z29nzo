<script type="text/javascript">
// --- Token display ---
const tokenDisplay = document.createElement("div");
Object.assign(tokenDisplay.style, {
  position: "fixed",
  fontSize: "1.6vw",
  top: "2.5vw",
  right: "1.5vw",
  padding: "3px 14px",
  borderRadius: "8px",
  background: "rgba(166, 185, 238,0.15)",  /* semi-transparent */
  border: "1px solid rgba(166, 185, 238,0.3)",
  textDecoration: "none",
  fontWeight: "500",
  transition: "all 0.3s ease",
  textShadow: "0 1px 2px rgba(0,0,0,0.6)",
  color: "rgb(166, 185, 238)",
  fontFamily: "'Damion', sans-serif",
  src: "url('/resource/Damion-8gnD.ttf') format('truetype')",
  visibility: "visible"
});
tokenDisplay.textContent = "0 tokens";
document.body.appendChild(tokenDisplay);

// --- Popup for rewards ---
const popup = document.createElement("div");
Object.assign(popup.style, {
  position: "fixed",
  top: "5vw",
  right: "1.5vw",
  padding: "12px 16px",
  color: "white",
  fontSize: "1.8vw",
  opacity: "0",
  transform: "translateX(12px)",
  transition: "opacity 0.35s ease, transform 0.35s ease",
  zIndex: 9999,
  pointerEvents: "none",
  color: "rgb(220, 228, 250)",
  fontFamily: "'Damion', sans-serif",
  src: "url('/resource/Damion-8gnD.ttf') format('truetype')"
});
document.body.appendChild(popup);

function showPopup(text){
  popup.textContent = text;
  popup.style.opacity = "1";
  popup.style.transform = "translateX(0)";
  setTimeout(()=>{
    popup.style.opacity = "0";
    popup.style.transform = "translateX(12px)";
  }, 3000);
}

// --- Token reward logic ---
const REWARD_SECONDS = 5; // 5 minutes
const REWARD_AMOUNT = 5;
let tokenInterval = null;
let secondsCounter = 0;

function startTokenRewardTimer(user){
  if(tokenInterval) return;
  secondsCounter = 0;
  tokenInterval = setInterval(async ()=>{
    secondsCounter++;
    if(secondsCounter >= REWARD_SECONDS){
      secondsCounter = 0;
      if(!user) return;

      const userRef = firebase.firestore().collection("users").doc(user.uid);
      try{
        await userRef.update({ tokens: firebase.firestore.FieldValue.increment(REWARD_AMOUNT) });
        showPopup(`${REWARD_AMOUNT} tokens earned !`);
      }catch(err){
        console.error("failed to give tokens", err);
      }
    }
  }, 1000);
}

function stopTokenRewardTimer(){
  if(tokenInterval){
    clearInterval(tokenInterval);
    tokenInterval = null;
    secondsCounter = 0;
  }
}

// --- Listen for auth changes ---
firebase.auth().onAuthStateChanged(user=>{
  stopTokenRewardTimer();
  if(user){
    startTokenRewardTimer(user);

    const userRef = firebase.firestore().collection("users").doc(user.uid);
    userRef.onSnapshot(doc=>{
      if(doc.exists){
        tokenDisplay.textContent = (doc.data().tokens || 0) + " tokens";
      }else{
        tokenDisplay.textContent = "0 tokens";
        userRef.set({tokens:0,email:user.email},{merge:true});
      }
    }, err=>console.error(err));
  }else{
    tokenDisplay.style.visibility = "hidden";
    tokenDisplay.textContent = "no account";
    
  }
});
</script>
