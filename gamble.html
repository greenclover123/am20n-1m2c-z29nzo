<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slot Machine</title>
<style>
  @font-face {
    font-family: 'Damion';
    src: url('/resource/Damion-8gnD.ttf') format('truetype');
  }

  body {
    margin: 0;
    height: 100%;
    color: white;
    font-family: 'Damion', sans-serif;
    background: linear-gradient(20deg, #020b6e, #0c0668, #1f076d, #021c4b, #365168);
    background-size: 200% 200%;
    animation: gradient-animation 25s ease infinite;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 5vw;
  }

  @keyframes gradient-animation {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  h1 {
    font-family: 'Damion', sans-serif;
    color: rgb(166, 185, 238);
    font-size: 4vw;
    text-shadow: 0 1px 2px rgba(0,0,0,0.7);
    margin-bottom: 1vw;
  }

  .slot-machine {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 2vw auto;
    font-size: 4vw;
    background: rgba(0,0,0,0.3);
    border: 2px solid rgba(166, 185, 238,0.3);
    border-radius: 1vw;
    padding: 1vw 2vw;
    overflow: hidden;
    height: 8vw;
    width: 40vw;
    position: relative;
  }

  .slot {
    width: 8vw;
    height: 8vw;
    background: rgba(0,0,0,0.4);
    border-radius: 0.5vw;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3vw;
    position: relative;
  }

  button {
    margin-top: 1.5vw;
    padding: 0.8vw 2vw;
    font-size: 1.2vw;
    border-radius: 0.5vw;
    border: none;
    background: rgba(166, 185, 238,0.15);
    color: rgb(166, 185, 238);
    cursor: pointer;
    transition: all 0.3s ease;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }

  button:hover {
    background: rgba(106, 104, 224, 0.3);
    border-color: rgba(0, 39, 122, 0.6);
    color: #0b00a1;
    transform: scale(0.95);
  }

  #balance {
    margin-top: 1vw;
    font-size: 1.5vw;
  }

  #bet-selection {
    margin-top: 1vw;
    font-size: 1.2vw;
  }

  .coin {
    width: 2vw;
    height: 2vw;
    background: gold;
    border-radius: 50%;
    position: absolute;
    top: -3vw;
    left: 50%;
    transform: translateX(-50%);
    animation: fall 0.6s ease forwards;
  }

  @keyframes fall {
    to { top: 6vw; opacity: 0; }
  }

  #guide {
    margin-top: 2vw;
    font-size: 1vw;
    color: rgb(200,200,255);
    text-align: center;
    line-height: 1.5;
  }
</style>
</head>
<body>
<h1>🎰 Slot Machine</h1>

<div id="bet-selection">
  Bet:
  <button onclick="insertBet(5)">5 Tokens</button>
  <button onclick="insertBet(10)">10 Tokens</button>
</div>

<div class="slot-machine">
  <div class="slot" id="slot1"></div>
  <div class="slot" id="slot2"></div>
  <div class="slot" id="slot3"></div>
</div>

<button id="spinBtn" onclick="playSlot()" disabled>Spin</button>
<div id="balance">Tokens: Loading...</div>

<div id="guide">
  <b>3 Matching Symbols Payout:</b><br>
  🍒, 🍋, 🍇, 🍉 → 1.3×<br>
  ⭐ → 2×<br>
  💎 → 3×
</div>

<script src="https://www.gstatic.com/firebasejs/12.2.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.2.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.2.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBA_M_gT63cj23LuIpjEL4qbD8czugbFXQ",
  authDomain: "skyless-84b51.firebaseapp.com",
  projectId: "skyless-84b51",
  storageBucket: "skyless-84b51.appspot.com",
  messagingSenderId: "990229888756",
  appId: "1:990229888756:web:ae7cc6a3f4bbbdb6c368a1"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let userTokens = 0;
let userRef = null;
let betAmount = 10;
let readyToSpin = false;
const symbols = ["🍒","🍋","🍇","🍉","⭐","💎"];
const spinBtn = document.getElementById("spinBtn");

auth.onAuthStateChanged(user => {
  if (user) {
    userRef = db.collection("users").doc(user.uid);
    userRef.onSnapshot(doc => {
      if (doc.exists) {
        userTokens = doc.data().tokens || 0;
        updateBalanceUI();
      }
    });
  } else {
    document.getElementById("balance").textContent = "Please log in first!";
  }
});

function updateBalanceUI() {
  document.getElementById("balance").textContent = "Tokens: " + userTokens;
}

function showPopup(message, color="lightblue") {
  const popup = document.createElement('div');
  Object.assign(popup.style, {
    position: "fixed",
    top: "5vw",
    right: "1.5vw",
    padding: "12px 16px",
    color: color,
    fontSize: "1.8vw",
    opacity: "0",
    transform: "translateX(12px)",
    transition: "opacity 0.35s ease, transform 0.35s ease",
    zIndex: 9999,
    pointerEvents: "none",
    fontFamily: "'Damion', sans-serif"
  });
  popup.textContent = message;
  document.body.appendChild(popup);
  requestAnimationFrame(() => {
    popup.style.opacity = "1";
    popup.style.transform = "translateX(0)";
  });
  setTimeout(() => {
    popup.style.opacity = "0";
    popup.style.transform = "translateX(12px)";
    setTimeout(() => popup.remove(), 400);
  }, 2000);
}

function insertBet(amount) {
  if (!userRef) { showPopup("Not logged in!", "red"); return; }
  if (userTokens < amount) { showPopup("Not enough tokens!", "red"); return; }

  betAmount = amount;
  spinBtn.disabled = true;
  readyToSpin = false;

  const coinCount = amount;
  const coinDelay = 600;
  let coinsInserted = 0;

  function dropCoin() {
    const coin = document.createElement('div');
    coin.className = "coin";
    document.body.appendChild(coin);
    setTimeout(() => coin.remove(), coinDelay);

    coinsInserted++;
    if (coinsInserted < coinCount) setTimeout(dropCoin, coinDelay);
    else {
      readyToSpin = true;
      spinBtn.disabled = false;
      showPopup(`Inserted ${amount} tokens`, "lightblue");
    }
  }
  dropCoin();
}

async function playSlot() {
  if (!userRef) { alert("Not logged in!"); return; }
  if (!readyToSpin) { alert("Insert your bet first!"); return; }
  if (userTokens < betAmount) { showPopup("Not enough tokens!", "red"); return; }

  userTokens -= betAmount;
  updateBalanceUI();

  const results = [0,0,0];
  const spins = [document.getElementById("slot1"), document.getElementById("slot2"), document.getElementById("slot3")];

  for (let i=0;i<spins.length;i++){
    const spin=spins[i]; spin.textContent="";
    let counter=0;
    const interval = setInterval(() => {
      spin.textContent = symbols[Math.floor(Math.random()*symbols.length)];
      counter++;
      if(counter > 15+i*5){
        clearInterval(interval);
        spin.textContent = symbols[Math.floor(Math.random()*symbols.length)];
        results[i] = spin.textContent;
      }
    }, 80);
  }

  await new Promise(res => setTimeout(res,2000));

  let payout = 0;
  let popupColor = "lightblue";

  if(results[0] === results[1] && results[1] === results[2]){
    const symbol = results[0];
    if(["🍒","🍋","🍇","🍉"].includes(symbol)) payout = Math.round(betAmount * 1.3);
    else if(symbol==="⭐") { payout = betAmount*2; popupColor="gold"; }
    else if(symbol==="💎") { payout = betAmount*3; popupColor="purple"; }

    userTokens += payout;
    showPopup(`🎉 You won ${payout} tokens!`, popupColor);
  } else {
    showPopup(`💀 You lost ${betAmount} tokens`, "red");
  }

  readyToSpin=false;
  spinBtn.disabled=true;
  await userRef.update({ tokens: userTokens });
  updateBalanceUI();
}

window.playSlot = playSlot;
window.insertBet = insertBet;
</script>
</body>
</html>
