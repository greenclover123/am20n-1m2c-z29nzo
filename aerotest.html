<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  background: #1a1a1a;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* --- Button --- */
button {
  position: relative;
  border: 1px solid #1b5da3;
  border-radius: 8px;
  padding: 12px 28px;
  font-size: 1.1em;
  font-family: "Segoe UI", sans-serif;
  color: white;
  background: linear-gradient(to bottom, #4ca0ff, #1e73d3);
  cursor: pointer;
  overflow: hidden;
  box-shadow: inset 0 1px rgba(255,255,255,0.4), 0 3px 10px rgba(0,0,0,0.3);
  transition: transform 0.1s ease;
}

/* --- Static Glint (top glossy overlay) --- */
button::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 45%;
  border-top-left-radius: 8px;
  border-top-right-radius: 8px;
  background: linear-gradient(
    to bottom,
    rgba(255,255,255,0.7),
    rgba(255,255,255,0.1)
  );
  pointer-events: none; /* makes sure it doesn’t block clicks */
}

/* --- Optional Hover Glow --- */
button:hover {
  box-shadow: 0 0 12px rgba(80,160,255,0.7), inset 0 1px rgba(255,255,255,0.4);
  transform: translateY(-1px);
}
</style>
</head>
<body>

<button>Click Me</button>

</body>
</html>
